<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" width="100%" height="100%">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d2433" stroke-width="1" opacity="0.3"/>
    </pattern>

    <!-- Neon Glow Filters -->
    <filter id="glow-center" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-da" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-sw" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-social" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Pulse keyframe animation for network lines */
    @keyframes pulse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -30; }
    }
    
    .line-ds { stroke: #00d2ff; stroke-width: 1.5; stroke-dasharray: 6 4; animation: pulse 1.5s linear infinite; opacity: 0.5; }
    .line-da { stroke: #f1c40f; stroke-width: 1.5; stroke-dasharray: 6 4; animation: pulse 1.5s linear infinite; opacity: 0.5; }
    .line-sw { stroke: #e84393; stroke-width: 1.5; stroke-dasharray: 6 4; animation: pulse 1.5s linear infinite; opacity: 0.5; }
    .line-social { stroke: #ffffff; stroke-width: 1.2; stroke-dasharray: 4 4; animation: pulse 2.5s linear infinite; opacity: 0.35; }
    
    /* Typography style overrides */
    .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; fill: #ffffff; text-anchor: middle; font-weight: bold; }
    .text-subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 10px; fill: #a0aec0; text-anchor: middle; }
    .text-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; fill: #e2e8f0; text-anchor: middle; font-weight: 600; }
    .emoji { font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .emoji-large { font-size: 26px; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <!-- Background base and cyber grid -->
  <rect width="860" height="530" fill="#080b10" rx="15" />
  <rect width="860" height="530" fill="url(#grid)" rx="15" />

  <!-- Animated Connections (Lines) -->
  <g>
    <!-- Center to branches -->
    <line x1="430" y1="265" x2="220" y2="200" class="line-ds" />
    <line x1="430" y1="265" x2="640" y2="200" class="line-da" />
    <line x1="430" y1="265" x2="430" y2="395" class="line-sw" />

    <!-- Center to Socials (Crown Satellite) -->
    <line x1="430" y1="265" x2="310" y2="185" class="line-social" />
    <line x1="430" y1="265" x2="390" y2="145" class="line-social" />
    <line x1="430" y1="265" x2="470" y2="145" class="line-social" />
    <line x1="430" y1="265" x2="550" y2="185" class="line-social" />

    <!-- DS Branch to Subs -->
    <line x1="220" y1="200" x2="70" y2="120" class="line-ds" />
    <line x1="220" y1="200" x2="220" y2="90" class="line-ds" />
    <line x1="220" y1="200" x2="70" y2="280" class="line-ds" />

    <!-- DA Branch to Subs -->
    <line x1="640" y1="200" x2="790" y2="120" class="line-da" />
    <line x1="640" y1="200" x2="640" y2="90" class="line-da" />
    <line x1="640" y1="200" x2="790" y2="280" class="line-da" />

    <!-- SW Branch to Subs -->
    <line x1="430" y1="395" x2="250" y2="460" class="line-sw" />
    <line x1="430" y1="395" x2="430" y2="475" class="line-sw" />
    <line x1="430" y1="395" x2="610" y2="460" class="line-sw" />
  </g>

  <!-- Animated Nodes (Groups with SMIL translation sum) -->

  <!-- ================= CENTRAL HUB ================= -->
  <g transform="translate(430, 265)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="4s" repeatCount="indefinite" additive="sum" />
    <!-- Outer emerald glow ring -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#2ecc71" stroke-width="2.5" opacity="0.8" filter="url(#glow-center)" />
    <!-- Core Hub Circle -->
    <circle cx="0" cy="0" r="30" fill="#0f172a" stroke="#2ecc71" stroke-width="2" />
    <text x="0" y="3" class="emoji-large">🎓</text>
    <text x="0" y="48" class="text-title">Prashant Raj</text>
    <text x="0" y="60" class="text-subtitle">MCA Postgraduate</text>
  </g>

  <!-- ================= SOCIALS satelliting above center ================= -->
  <!-- Social 1: Portfolio -->
  <g transform="translate(310, 185)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -3,-3; 0,0" dur="5s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7" filter="url(#glow-social)" />
    <circle cx="0" cy="0" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="1" />
    <text x="0" y="2" class="emoji">🌐</text>
    <text x="0" y="28" class="text-label" style="font-size: 9px; fill: #cbd5e0;">Portfolio</text>
  </g>

  <!-- Social 2: LinkedIn -->
  <g transform="translate(390, 145)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="4.2s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#0077b5" stroke-width="1.5" opacity="0.7" filter="url(#glow-social)" />
    <circle cx="0" cy="0" r="15" fill="#0f172a" stroke="#0077b5" stroke-width="1" />
    <text x="0" y="2" class="emoji">💼</text>
    <text x="0" y="28" class="text-label" style="font-size: 9px; fill: #cbd5e0;">LinkedIn</text>
  </g>

  <!-- Social 3: Email -->
  <g transform="translate(470, 145)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="4.8s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#d14836" stroke-width="1.5" opacity="0.7" filter="url(#glow-social)" />
    <circle cx="0" cy="0" r="15" fill="#0f172a" stroke="#d14836" stroke-width="1" />
    <text x="0" y="2" class="emoji">📧</text>
    <text x="0" y="28" class="text-label" style="font-size: 9px; fill: #cbd5e0;">Email</text>
  </g>

  <!-- Social 4: Instagram -->
  <g transform="translate(550, 185)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 3,-3; 0,0" dur="4.6s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#e4405f" stroke-width="1.5" opacity="0.7" filter="url(#glow-social)" />
    <circle cx="0" cy="0" r="15" fill="#0f172a" stroke="#e4405f" stroke-width="1" />
    <text x="0" y="2" class="emoji">📷</text>
    <text x="0" y="28" class="text-label" style="font-size: 9px; fill: #cbd5e0;">Instagram</text>
  </g>


  <!-- ================= DATA SCIENCE TRACK (LEFT) ================= -->
  <!-- DS Hub Node -->
  <g transform="translate(220, 200)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -4,3; 0,0" dur="5.5s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#00d2ff" stroke-width="2" opacity="0.8" filter="url(#glow-ds)" />
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#00d2ff" stroke-width="1.5" />
    <text x="0" y="2" class="emoji">📊</text>
    <text x="0" y="34" class="text-title" style="fill: #00d2ff;">Data Science</text>
  </g>

  <!-- DS Sub 1: Machine Learning -->
  <g transform="translate(70, 120)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -3,-3; 0,0" dur="4.8s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.7" filter="url(#glow-ds)" />
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#00d2ff" stroke-width="1" />
    <text x="0" y="2" class="emoji">🤖</text>
    <text x="0" y="30" class="text-label">ML Models</text>
  </g>

  <!-- DS Sub 2: Scikit-learn -->
  <g transform="translate(220, 90)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="4.2s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.7" filter="url(#glow-ds)" />
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#00d2ff" stroke-width="1" />
    <text x="0" y="2" class="emoji">⚙️</text>
    <text x="0" y="30" class="text-label">scikit-learn</text>
  </g>

  <!-- DS Sub 3: Pandas & NumPy -->
  <g transform="translate(70, 270)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -3,3; 0,0" dur="5.2s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.7" filter="url(#glow-ds)" />
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#00d2ff" stroke-width="1" />
    <text x="0" y="2" class="emoji">🐼</text>
    <text x="0" y="30" class="text-label">Pandas &amp; NumPy</text>
  </g>


  <!-- ================= DATA ANALYTICS TRACK (RIGHT) ================= -->
  <!-- DA Hub Node -->
  <g transform="translate(640, 200)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 4,3; 0,0" dur="5.8s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#f1c40f" stroke-width="2" opacity="0.8" filter="url(#glow-da)" />
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#f1c40f" stroke-width="1.5" />
    <text x="0" y="2" class="emoji">📈</text>
    <text x="0" y="34" class="text-title" style="fill: #f1c40f;">Analytics</text>
  </g>

  <!-- DA Sub 1: Power BI -->
  <g transform="translate(790, 120)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 3,-3; 0,0" dur="4.6s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#f1c40f" stroke-width="1.5" opacity="0.7" filter="url(#glow-da)" />
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#f1c40f" stroke-width="1" />
    <text x="0" y="2" class="emoji">📉</text>
    <text x="0" y="30" class="text-label">Power BI</text>
  </g>

  <!-- DA Sub 2: MySQL -->
  <g transform="translate(640, 90)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="4.4s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#f1c40f" stroke-width="1.5" opacity="0.7" filter="url(#glow-da)" />
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#f1c40f" stroke-width="1" />
    <text x="0" y="2" class="emoji">🗄️</text>
    <text x="0" y="30" class="text-label">MySQL</text>
  </g>

  <!-- DA Sub 3: SQLite -->
  <g transform="translate(790, 270)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 3,3; 0,0" dur="5.4s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#f1c40f" stroke-width="1.5" opacity="0.7" filter="url(#glow-da)" />
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#f1c40f" stroke-width="1" />
    <text x="0" y="2" class="emoji">💾</text>
    <text x="0" y="30" class="text-label">SQLite</text>
  </g>


  <!-- ================= SOFTWARE & AUTOMATION TRACK (BOTTOM) ================= -->
  <!-- SW Hub Node -->
  <g transform="translate(430, 395)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,5; 0,0" dur="4.8s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#e84393" stroke-width="2" opacity="0.8" filter="url(#glow-sw)" />
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#e84393" stroke-width="1.5" />
    <text x="0" y="2" class="emoji">💻</text>
    <text x="0" y="34" class="text-title" style="fill: #e84393;">Software &amp; Auto</text>
  </g>

  <!-- SW Sub 1: Python Automation -->
  <g transform="translate(250, 460)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -3,3; 0,0" dur="5.0s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#e84393" stroke-width="1.5" opacity="0.7" filter="url(#glow-sw)" />
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#e84393" stroke-width="1" />
    <text x="0" y="2" class="emoji">🐍</text>
    <text x="0" y="30" class="text-label">Python Scripting</text>
  </g>

  <!-- SW Sub 2: Core Programming (C++ & Java) -->
  <g transform="translate(430, 475)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,4; 0,0" dur="4.5s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#e84393" stroke-width="1.5" opacity="0.7" filter="url(#glow-sw)" />
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#e84393" stroke-width="1" />
    <text x="0" y="2" class="emoji">☕</text>
    <text x="0" y="30" class="text-label">C++ &amp; Java</text>
  </g>

  <!-- SW Sub 3: Git & DevOps -->
  <g transform="translate(610, 460)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 3,3; 0,0" dur="5.2s" repeatCount="indefinite" additive="sum" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#e84393" stroke-width="1.5" opacity="0.7" filter="url(#glow-sw)" />
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#e84393" stroke-width="1" />
    <text x="0" y="2" class="emoji">🐳</text>
    <text x="0" y="30" class="text-label">Git &amp; DevOps</text>
  </g>

</svg>
